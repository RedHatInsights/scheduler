name: Renovate Config Validator
on:
  pull_request:
    branches:
      - master
    paths:
      - renovate.jsonc
  push:
    branches:
      - master
    paths:
      - renovate.jsonc
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: quay.io/konflux-ci/mintmaker-renovate-image:latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate renovate.jsonc
        run: |
          podman run --rm -v ./:/src:z ${{ env.TEST_IMAGE }} renovate-config-validator /src/renovate.jsonc
