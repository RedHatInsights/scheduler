---
name: PR Check

on:
  - pull_request

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Go
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492 # v2
      with:
        go-version: ${{ matrix.go-version }}
    - name: Run Tests
      run: go test ./...
